# ============================================
# MT E-Commerce — Docker Compose
# ============================================
# Services: MongoDB, Redis, Backend
# ============================================

version: '3.9'

services:
  # ------- MongoDB -------
  mongodb:
    image: mongo:7
    container_name: mt-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: mt-ecommerce
    volumes:
      - mongodb_data:/data/db
    networks:
      - mt-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ------- Redis -------
  redis:
    image: redis:7-alpine
    container_name: mt-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - mt-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ------- Backend -------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env.development
    environment:
      MONGO_URI: mongodb://mongodb:27017/mt-ecommerce
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mt-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  mt-network:
    driver: bridge
